name: Auto-Update DSA Counts

on:
  push:
    branches:
      - main
    # Only trigger the action if changes happen in these paths
    paths:
      - 'LeetCode/**'
      - 'GeeksforGeeks/**'
      - 'CSES/**'
      - 'update_counts.js'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Update Script
        run: node update_counts.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add README.md
          # The exit 0 ensures the workflow doesn't fail if there's nothing new to commit
          git commit -m "docs: auto-update DSA problem counts" || exit 0
          git push
